# LibreChat tối giản cho toolkit: web UI + MongoDB + Meilisearch (tìm kiếm hội thoại).
# Không chép file này đi chỗ khác: scripts/80_setup_librechat.sh tự chép vào $LIBRECHAT_DIR
# cùng file .env (sinh tự động) và librechat.yaml (sinh theo profile).
# Model chạy bằng vLLM trên máy host, LibreChat gọi qua http://host.docker.internal:<PORT>/v1
name: librechat

services:
  api:
    image: ${LIBRECHAT_IMAGE}
    container_name: librechat-api
    ports:
      - "${LIBRECHAT_BIND}:${PORT}:${PORT}"
    depends_on:
      - mongodb
      - meilisearch
    restart: unless-stopped
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - NO_PROXY=localhost,127.0.0.1,::1,mongodb,meilisearch,host.docker.internal
      - no_proxy=localhost,127.0.0.1,::1,mongodb,meilisearch,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data

  mongodb:
    image: mongo:8.0.20
    container_name: librechat-mongodb
    restart: unless-stopped
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: librechat-meilisearch
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
